<!-- OVERHEAT UI: Data Table Component (with Checkbox Selection & Avatars) -->

<div class="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] overflow-hidden shadow-sm">
  <div class="p-4 border-b border-[var(--border-subtle)] flex items-center justify-between gap-4">
    <div class="relative w-64">
      <input type="text" placeholder="Filter baris..." class="w-full px-3 py-1.5 pl-8 rounded-lg bg-[var(--bg-surface-raised)] border border-[var(--border-subtle)] text-xs text-[var(--text-primary)] placeholder-[var(--text-muted)] focus:outline-none focus:border-indigo-600 transition-all">
      <svg class="w-3.5 h-3.5 text-[var(--text-muted)] absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </div>
    <div class="flex items-center gap-2">
      <button class="px-3 py-1.5 rounded-lg bg-[var(--bg-surface-raised)] border border-[var(--border-subtle)] text-xs text-[var(--text-secondary)] hover:text-[var(--text-primary)] font-medium">Filter</button>
      <button class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-xs">+ Tambah Data</button>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left text-xs border-collapse">
      <thead class="bg-slate-50 dark:bg-white/[0.02] border-b border-[var(--border-subtle)] text-[var(--text-muted)] font-semibold">
        <tr>
          <th class="py-3 px-3 w-10 text-center"><input type="checkbox" class="rounded border-slate-300 dark:border-white/20 text-indigo-600"></th>
          <th class="py-3 px-4">Pengguna</th>
          <th class="py-3 px-4 font-mono">ID Referensi</th>
          <th class="py-3 px-4">Paket / Layanan</th>
          <th class="py-3 px-4 font-mono">Nominal</th>
          <th class="py-3 px-4">Status</th>
          <th class="py-3 px-4 text-right">Aksi</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-[var(--border-subtle)] text-[var(--text-secondary)]">
        <tr class="hover:bg-slate-50 dark:hover:bg-white/[0.03] transition-colors">
          <td class="py-3 px-3 text-center"><input type="checkbox" class="rounded border-slate-300 dark:border-white/20 text-indigo-600"></td>
          <td class="py-3 px-4">
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-full bg-slate-800 text-white dark:bg-slate-700 flex items-center justify-center font-bold text-xs">J</div>
              <div>
                <div class="font-bold text-[var(--text-primary)]">Jessica Pratama</div>
                <div class="text-[11px] text-[var(--text-muted)]">jessica@perusahaan.com</div>
              </div>
            </div>
          </td>
          <td class="py-3 px-4 font-mono text-[11px] text-indigo-600 dark:text-indigo-400 font-semibold">#ORD-94820</td>
          <td class="py-3 px-4">Enterprise Cloud Suite</td>
          <td class="py-3 px-4 font-mono font-bold text-[var(--text-primary)]">$890.00</td>
          <td class="py-3 px-4">
            <span class="px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-700 dark:text-emerald-400 font-mono text-[10px] font-bold">LUNAS</span>
          </td>
          <td class="py-3 px-4 text-right">
            <button class="px-2.5 py-1 rounded-lg bg-[var(--bg-surface-raised)] border border-[var(--border-subtle)] hover:text-[var(--text-primary)] font-medium">Rincian</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- OVERHEAT UI: Command Palette (⌘K / Ctrl+K) Component -->

<div class="fixed inset-0 z-50 flex items-start justify-center pt-20 px-4 bg-black/60 backdrop-blur-sm">
  <div class="w-full max-w-lg rounded-2xl bg-[var(--bg-surface)] border border-[var(--border-subtle)] shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
    <div class="p-4 border-b border-[var(--border-subtle)] flex items-center gap-3">
      <svg class="w-4 h-4 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" placeholder="Ketik perintah atau cari modul..." autofocus class="flex-1 bg-transparent border-none text-xs text-[var(--text-primary)] placeholder-[var(--text-muted)] focus:outline-none">
      <kbd class="px-1.5 py-0.5 text-[10px] font-mono bg-[var(--bg-surface-raised)] border border-[var(--border-subtle)] rounded text-[var(--text-muted)]">ESC</kbd>
    </div>

    <div class="p-2 max-h-72 overflow-y-auto space-y-1 text-xs">
      <div class="px-2.5 py-1 text-[10px] font-mono uppercase tracking-wider text-[var(--text-muted)]">Navigasi Cepat</div>
      
      <button class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5 text-[var(--text-primary)] transition-all text-left">
        <div class="flex items-center gap-2.5">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"/></svg>
          <span>Buka Ringkasan Dashboard</span>
        </div>
        <kbd class="text-[10px] font-mono text-[var(--text-muted)]">G D</kbd>
      </button>

      <button class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5 text-[var(--text-primary)] transition-all text-left">
        <div class="flex items-center gap-2.5">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4"/></svg>
          <span>Lihat Daftar Pesanan</span>
        </div>
        <kbd class="text-[10px] font-mono text-[var(--text-muted)]">G O</kbd>
      </button>

      <div class="px-2.5 py-1 text-[10px] font-mono uppercase tracking-wider text-[var(--text-muted)] mt-2">Aksi Cepat</div>

      <button class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5 text-[var(--text-primary)] transition-all text-left">
        <div class="flex items-center gap-2.5">
          <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span>Ekspor Semua Transaksi ke CSV</span>
        </div>
        <span class="text-[10px] font-mono text-emerald-600 dark:text-emerald-400 font-bold">.CSV</span>
      </button>
    </div>
  </div>
</div>

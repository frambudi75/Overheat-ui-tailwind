<!-- OVERHEAT UI: Button Component -->
<!-- Usage: Copy-paste any variant into your Tailwind project -->

<!-- 1. Primary Solid Button -->
<button class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs font-bold transition-all inline-flex items-center gap-2 shadow-sm">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
  <span>Primary Action</span>
</button>

<!-- 2. Secondary Raised Button -->
<button class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 active:scale-95 text-slate-700 dark:text-slate-200 text-xs font-semibold border border-slate-200 dark:border-white/10 transition-all inline-flex items-center gap-2">
  <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
  <span>Secondary Action</span>
</button>

<!-- 3. Outline Button -->
<button class="px-4 py-2 rounded-lg bg-transparent hover:bg-slate-100 dark:hover:bg-white/5 active:scale-95 text-slate-900 dark:text-white text-xs font-semibold border border-slate-300 dark:border-white/20 transition-all inline-flex items-center gap-2">
  <span>Outline Action</span>
</button>

<!-- 4. Ghost Button -->
<button class="px-3 py-2 rounded-lg bg-transparent hover:bg-slate-100 dark:hover:bg-white/5 active:scale-95 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white text-xs font-medium transition-all inline-flex items-center gap-2">
  <span>Ghost Action</span>
</button>

<!-- 5. Destructive Button -->
<button class="px-4 py-2 rounded-lg bg-rose-50 dark:bg-rose-500/10 hover:bg-rose-100 dark:hover:bg-rose-500/20 active:scale-95 text-rose-600 dark:text-rose-400 text-xs font-bold border border-rose-200 dark:border-rose-500/20 transition-all inline-flex items-center gap-2">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
  <span>Hapus Data</span>
</button>

<!-- 6. Loading State Button -->
<button disabled class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold opacity-75 cursor-not-allowed inline-flex items-center gap-2">
  <svg class="animate-spin w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
  <span>Memproses...</span>
</button>

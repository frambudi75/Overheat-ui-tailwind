<!-- OVERHEAT UI PRIMITIVE: Radio Group -->

<div class="space-y-2">
  <label class="block text-xs font-semibold text-[var(--text-secondary)] mb-1">METODE PENAGIHAN</label>
  <div class="space-y-2">
    <label class="flex items-center justify-between p-3 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] hover:border-indigo-500/40 cursor-pointer transition-all">
      <div class="flex items-center gap-3">
        <input type="radio" name="billing-cycle" value="monthly" checked class="text-indigo-600 focus:ring-0 cursor-pointer">
        <span class="text-xs font-medium text-[var(--text-primary)]">Penagihan Bulanan</span>
      </div>
      <span class="text-[11px] font-mono text-[var(--text-muted)]">Standar</span>
    </label>
    <label class="flex items-center justify-between p-3 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] hover:border-indigo-500/40 cursor-pointer transition-all">
      <div class="flex items-center gap-3">
        <input type="radio" name="billing-cycle" value="annual" class="text-indigo-600 focus:ring-0 cursor-pointer">
        <span class="text-xs font-medium text-[var(--text-primary)]">Penagihan Tahunan</span>
      </div>
      <span class="text-[10px] font-mono text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded font-bold">HEMAT 20%</span>
    </label>
  </div>
</div>

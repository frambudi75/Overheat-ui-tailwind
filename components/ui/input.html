<!-- OVERHEAT UI: Input & Form Components -->

<!-- 1. Search Bar with Keyboard Shortcut Badge -->
<div class="relative w-full max-w-sm">
  <input type="text" placeholder="Cari order, produk, invoice..." class="w-full px-3.5 py-2 pl-9 pr-12 rounded-lg bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all">
  <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
  <kbd class="absolute right-2.5 top-2.5 px-1.5 py-0.5 text-[10px] font-mono bg-black/5 dark:bg-white/10 border border-slate-200 dark:border-white/10 rounded text-slate-500">⌘K</kbd>
</div>

<!-- 2. Standard Text Input with Label -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300">NAMA PELANGGAN</label>
  <input type="text" required placeholder="Contoh: Jessica Pratama" class="w-full px-3.5 py-2 rounded-lg bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-indigo-600 transition-all">
</div>

<!-- 3. Form Select Dropdown -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300">PILIH PAKET</label>
  <select class="w-full px-3.5 py-2 rounded-lg bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-600 transition-all">
    <option value="Enterprise">Enterprise Cloud Suite ($890)</option>
    <option value="Pro">Pro Developer Plan ($450)</option>
    <option value="Starter">Starter Cloud Tier ($120)</option>
  </select>
</div>

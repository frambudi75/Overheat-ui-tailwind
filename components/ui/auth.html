<!-- OVERHEAT UI: Authentication (Split-Screen Login & Register) Component -->

<div class="w-full max-w-4xl mx-auto rounded-2xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#151924] overflow-hidden shadow-2xl grid grid-cols-1 lg:grid-cols-2 min-h-[520px]">
  <!-- Left Branding Graphic Panel -->
  <div class="p-8 sm:p-10 bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-white flex flex-col justify-between relative overflow-hidden border-b lg:border-b-0 lg:border-r border-white/10">
    <div class="space-y-4 relative z-10">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-md">O</div>
        <span class="font-extrabold text-base tracking-tight">OVERHEAT OS</span>
      </div>
      <h2 class="text-2xl font-black tracking-tight leading-snug pt-3">
        Pintu Masuk Terpadu Admin & SaaS.
      </h2>
      <p class="text-xs text-slate-400 leading-relaxed">
        Kelola pesanan, konversi multi-currency USD & IDR, dan nikmati kecepatan navigasi tanpa lag.
      </p>
    </div>

    <div class="relative z-10 pt-6 border-t border-white/10 flex items-center justify-between text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>Enkripsi TLS 1.3 Aktif</span>
      </div>
      <span class="font-mono">v1.4.0</span>
    </div>
  </div>

  <!-- Right Auth Form Card -->
  <div class="p-8 sm:p-10 flex flex-col justify-center space-y-5 bg-white dark:bg-[#151924]">
    <div>
      <h3 class="text-xl font-bold text-slate-900 dark:text-white">Masuk ke Dashboard</h3>
      <p class="text-xs text-slate-500 mt-1">Masukkan kredensial akun administrator Anda.</p>
    </div>

    <form class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">EMAIL / USERNAME</label>
        <input type="email" value="admin@overheat.id" required class="w-full px-3.5 py-2.5 rounded-lg bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-600 transition-all">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">KATA SANDI</label>
          <a href="#" class="text-[11px] text-indigo-600 dark:text-indigo-400 hover:underline">Lupa Sandi?</a>
        </div>
        <input type="password" value="••••••••••••" required class="w-full px-3.5 py-2.5 rounded-lg bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-600 transition-all">
      </div>

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="inline-flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-400">
          <input type="checkbox" checked class="rounded border-slate-300 dark:border-white/20 text-indigo-600">
          <span>Ingat sesi saya (30 hari)</span>
        </label>
      </div>

      <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs font-bold transition-all shadow-md shadow-indigo-600/20">
        Masuk ke Admin Panel ➔
      </button>
    </form>
  </div>
</div>
